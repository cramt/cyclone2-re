[package]
name = "cram"
version = "0.1.0"
edition = "2021"
description = "Cyclone II EP2C35 bitstream reverse engineering: the device database, the Quartus frontend and the checks against Quartus, over chipsmith's assembler"

[dependencies]
ddb = { path = "../ddb" }
# The assembler (`cram pack`, `cram svf`) lives in chipsmith (its ADR-0003);
# the checks here guard that one implementation.
chipsmith-cyclone2 = { git = "https://github.com/A-H-Technology/chipsmith", rev = "005575ea82a718a5bbf21e24c917db7679a1326c" }
anyhow = "1"
serde_json = "1"
serde = { version = "1", features = ["derive"] }
# The shipped device database (db/): a stable, documented wire format
# (https://postcard.jamesmunns.com/wire-format) over serde, xz-compressed
# with a pure-Rust encoder (lzma-rs only writes literals, ~2x the size).
postcard = { version = "1", default-features = false, features = ["use-std"] }
lzma-rust2 = { version = "0.21", default-features = false, features = ["std", "encoder", "optimization", "xz"] }
